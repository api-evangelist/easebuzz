aid: easebuzz
name: Easebuzz
description: 'Easebuzz is an Indian payments and financial-technology platform providing Software-as-a-Service
  embedded with payments infrastructure for businesses across India. Its products include a payment
  gateway supporting 150+ payment options (cards, UPI, net banking, wallets, EMI, BNPL), payment links,
  and in-store POS; collections products such as EasyCollect subscriptions, InstaCollect virtual accounts,
  Slices payment splitting and FeesBuzz fee collection; Wire payouts over NEFT, RTGS, IMPS and UPI with
  vendor and tax payments; sub-merchant management for platforms and marketplaces; Easebuzz Neo connected
  banking APIs; and SaaS tools including SmartBilling, Teller, Forms and Webstore. Developers integrate
  through REST APIs authenticated with a merchant key, salt and SHA-512 request hash, backed by official
  SDKs and e-commerce plugins across web and mobile platforms.'
